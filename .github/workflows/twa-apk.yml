name: TWA APK

# Builds the EzzyList Android package from twa-app/.
#
# Why CI: this lab host is aarch64/musl. Google's Android SDK build-tools and
# Bubblewrap's JDK installer are x86_64/glibc only, so the APK cannot be
# compiled locally. This runs on the same x86_64 Linux that Bubblewrap targets.
#
# The APK is signed with the project release key (repo secret). The last step
# re-reads the certificate from the built APK and fails the job if it does not
# match the fingerprint published in public/.well-known/assetlinks.json —
# a mismatch would silently break TWA URL-bar hiding on real devices.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'twa-app/**'
      - 'public/.well-known/assetlinks.json'
      - '.github/workflows/twa-apk.yml'
  push:
    branches: [main]
    paths:
      - 'twa-app/**'
      - 'public/.well-known/assetlinks.json'
      - '.github/workflows/twa-apk.yml'

defaults:
  run:
    working-directory: twa-app

jobs:
  build-apk:
    name: assembleRelease (signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Deliberately NOT android-actions/setup-android: it requests the
      # "tools" package, which was removed from Google's SDK repository, and
      # the action fails before any of our steps run. The runner image already
      # ships a working sdkmanager, so drive it directly.
      - name: Locate Android SDK
        working-directory: .
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d "$HOME/Android/Sdk" ]; then
              echo "ANDROID_HOME=$HOME/Android/Sdk" >> "$GITHUB_ENV"
              echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> "$GITHUB_ENV"
            else
              echo "::error::no Android SDK found on this runner"
              exit 1
            fi
          else
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi

      - name: Accept licenses and install platform + build-tools
        working-directory: .
        run: |
          SDK="${ANDROID_HOME:-$HOME/Android/Sdk}"
          CMDLINE=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)
          if [ -z "$CMDLINE" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            exit 1
          fi
          echo "$CMDLINE" >> "$GITHUB_PATH"
          export PATH="$CMDLINE:$PATH"
          echo "sdkmanager: $(command -v sdkmanager)"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          # Platform matching compileSdk in app/build.gradle.
          sdkmanager --install "platforms;android-36" >/dev/null

          # Don't hardcode a build-tools version blindly: use the pinned one if
          # this SDK repository has it, otherwise take the newest published.
          if sdkmanager --list 2>/dev/null | grep -q "build-tools;36.1.0"; then
            echo "using pinned build-tools 36.1.0"
            sdkmanager --install "build-tools;36.1.0" >/dev/null
          else
            NEWEST=$(sdkmanager --list 2>/dev/null \
              | sed -n 's/^ *\(build-tools;[0-9][^ |]*\).*/\1/p' \
              | sort -V | tail -1)
            echo "pinned 36.1.0 unavailable; installing ${NEWEST}"
            sdkmanager --install "$NEWEST" >/dev/null
          fi

          echo "build-tools: $(ls "$SDK/build-tools")"
          echo "platforms:   $(ls "$SDK/platforms")"

      - name: Decode release keystore
        env:
          KSTORE_B64: ${{ secrets.EZZYLIST_KSTORE_B64 }}
        run: |
          if [ -z "$KSTORE_B64" ]; then
            echo "::error::secret EZZYLIST_KSTORE_B64 is unavailable — refusing to ship an unsigned (uninstallable) APK"
            exit 1
          fi
          echo "$KSTORE_B64" | base64 -d > "$RUNNER_TEMP/ezzylist.keystore"
          echo "KSTORE_PATH=$RUNNER_TEMP/ezzylist.keystore" >> "$GITHUB_ENV"
          echo "decoded keystore bytes: $(wc -c < "$RUNNER_TEMP/ezzylist.keystore")"

      - name: Build release APK
        env:
          KSTORE_PW: ${{ secrets.EZZYLIST_KSTORE_PW }}
          KEY_ALIAS: ${{ secrets.EZZYLIST_KEY_ALIAS }}
          KEY_PW: ${{ secrets.EZZYLIST_KEY_PW }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is signed with the published certificate
        run: |
          SDK="${ANDROID_HOME:-$HOME/Android/Sdk}"
          BUILD_TOOLS="$(ls -d "$SDK/build-tools"/* | sort -V | tail -1)"
          echo "apksigner from: $BUILD_TOOLS"
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "APK bytes: $(wc -c < "$APK")"

          echo "--- apksigner verify ---"
          "$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK" \
            | grep -E "Verifies|Signer #1 certificate SHA-256 digest"

          ACTUAL=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            | grep "Signer #1 certificate SHA-256 digest" \
            | awk '{print $NF}' | tr -d ':' | tr 'a-f' 'A-F')
          PUBLISHED=$(python3 -c "import json;print(json.load(open('../public/.well-known/assetlinks.json'))[0]['target']['sha256_cert_fingerprints'][0].replace(':','').upper())")

          echo "actual    : $ACTUAL"
          echo "published : $PUBLISHED"
          if [ "$ACTUAL" != "$PUBLISHED" ]; then
            echo "::error::APK signing certificate does not match public/.well-known/assetlinks.json — TWA verification would fail on device"
            exit 1
          fi
          echo "OK: APK certificate matches the published assetlinks fingerprint"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ezzylist-release-apk
          path: twa-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error