name: Perf (cold/warm start)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          nohup npx vite preview --port 4178 --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4178/ >/dev/null; then echo "ready"; break; fi
            sleep 1
          done

      - name: Measure perf
        env:
          CHROME_PATH: /usr/bin/chromium-browser
        run: node scripts/measure-perf.mjs --stub-api --repeat 2 --json > perf.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf.json
