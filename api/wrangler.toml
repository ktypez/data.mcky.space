name = "data-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Route traffic from data.mcky.space/api/* to this Worker
routes = [
  { pattern = "data.mcky.space/api/*", zone_name = "mcky.space" }
]

# D1 Database binding (same as Pages)
[[d1_databases]]
binding = "DB"
database_name = "ezzylist-db"
database_id = "d3f71826-3af4-4950-815a-2965fabb179b"

# R2 bucket for client photos (same as Pages)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ezzylist"

[vars]
R2_PUBLIC_URL = "https://pub-462db07575b84a13b83ba0f2632f6ec2.r2.dev"
