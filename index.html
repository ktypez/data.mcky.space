<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#15151d" />
    <title>DATA Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://data-api.fall3n.workers.dev" />
    <link rel="dns-prefetch" href="https://pub-462db07575b84a13b83ba0f2632f6ec2.r2.dev" />
    <!-- App chrome fonts load without blocking the first paint. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..1000&family=Noto+Sans+Thai:wght@100..900&family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..1000&family=Noto+Sans+Thai:wght@100..900&family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <!-- NOTE: leaflet is NOT loaded globally. MapPreview and
      MapPicker import the npm bundle (shared `map` chunk) only
      on pages that render a map, so the catalog pays zero map cost. -->
    <script>
      // Pre-paint theme boot: ALWAYS load a full theme stylesheet before
      // React mounts (saved theme, else the default = portal), so the app is
      // never unstyled and the :root/.dark fallback vars are unnecessary.
      // Keep THEMES in sync with src/lib/design/themes.ts (id + staticCss +
      // dark-only flag). Fonts load lazily via ThemeInjector, not here.
      (function () {
        var THEMES = {
          'ledger': { css: '/themes/ledger.css', dark: false },
          'claude': { css: '/themes/claude.css', dark: false },
          'blueprint': { css: '/themes/blueprint.css', dark: false },
          'mono': { css: '/themes/mono.css', dark: false },
          'lotus': { css: '/themes/lotus.css', dark: false },
          'terminal': { css: '/themes/terminal.css', dark: false },
          'custom': { css: '/themes/custom.css', dark: false },
        };
        var id = null;
        try {
          var raw = localStorage.getItem('data-ledger-ui');
          if (raw) {
            var data = JSON.parse(raw);
            if (data && data.state && typeof data.state.theme === 'string') id = data.state.theme;
          }
        } catch (e) {}
        // No legacy migration — the 6 adopted themes are all fresh; any stale
        // saved id falls through to the Ledger default below.
        if (!THEMES[id]) id = 'ledger'; // invalid/stale id → default theme
        var t = THEMES[id];
        var root = document.documentElement;
        root.setAttribute('data-theme', id);
        // dark-only themes force .dark; light-only themes always stay light;
        // dual themes respect saved mode/system.
        var dark = t.dark;
        if (!dark && !t.light) {
          var mode = null;
          try { mode = localStorage.getItem('data-ledger-mode'); } catch (e) {}
          if (mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            dark = true;
          }
        }
        if (dark) root.classList.add('dark');
        if (id === 'custom' && data && data.state && data.state.customPalette) {
          var palette = data.state.customPalette[dark ? 'dark' : 'light'];
          if (palette) {
            root.style.setProperty('--custom-background', palette.background);
            root.style.setProperty('--custom-surface', palette.surface);
            root.style.setProperty('--custom-text', palette.text);
            root.style.setProperty('--custom-primary', palette.primary);
            root.style.setProperty('--custom-primary-foreground', palette.primaryForeground || '#ffffff');
            root.style.setProperty('--custom-border', palette.border);
          }
        }
        var l = document.createElement('link');
        l.id = 'app-theme-stylesheet';
        l.dataset.appTheme = id;
        l.rel = 'stylesheet';
        l.href = t.css;
        document.head.appendChild(l);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
