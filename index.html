<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#ffffff" />
    <title>DATA Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://data-api.fall3n.workers.dev" />
    <link rel="dns-prefetch" href="https://pub-462db07575b84a13b83ba0f2632f6ec2.r2.dev" />
    <!-- V6 monochrome typography; Noto Sans Thai covers Thai glyphs. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      />
    </noscript>
    <!-- NOTE: leaflet is NOT loaded globally. MapPreview and
      MapPicker import the npm bundle (shared `map` chunk) only
      on pages that render a map, so the catalog pays zero map cost. -->
    <script>
      // V6 pre-paint boot: keep the user's light/dark preference without loading
      // the retired palette stylesheet. Legacy palette IDs map to Monochrome.
      (function () {
        var mode = null;
        try { mode = localStorage.getItem('data-ledger-mode'); } catch (e) {}
        var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.setAttribute('data-theme', 'monochrome');
        root.setAttribute('data-palette', 'monochrome');
        root.setAttribute('data-mode', dark ? 'dark' : 'light');
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', dark ? '#0b0b0b' : '#ffffff');
        var density = 'cozy';
        try {
          var v5 = JSON.parse(localStorage.getItem('data-ledger-v5') || '{}');
          if (v5 && v5.state && v5.state.density === 'compact') density = 'compact';
        } catch (e) {}
        root.setAttribute('data-density', density);
        root.setAttribute('data-texture', 'off');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
