<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#9DD2F7" />
    <title>DATA Ledger</title>
    <!-- V6 uses the canonical font stack; no remote font stylesheet is loaded. -->
    <link rel="preconnect" href="https://data-api.fall3n.workers.dev" />
    <link rel="dns-prefetch" href="https://pub-462db07575b84a13b83ba0f2632f6ec2.r2.dev" />
    <!-- NOTE: leaflet is NOT loaded globally. MapPreview and
      MapPicker import the npm bundle (shared `map` chunk) only
      on pages that render a map, so the catalog pays zero map cost. -->
    <script>
      // V6 pre-paint boot: mirror DATA's stored mode into data-v6-mode before
      // the shared theme CSS and <Scenery /> render.
      (function () {
        var mode = null;
        try { mode = localStorage.getItem('data-ledger-mode'); } catch (e) {}
        var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var palette = 'matcha';
        try {
          var savedTheme = JSON.parse(localStorage.getItem('data-ledger-ui') || '{}');
          var savedPalette = savedTheme && savedTheme.state && savedTheme.state.theme;
          if (['matcha', 'coral', 'blueberry', 'butter'].indexOf(savedPalette) !== -1) palette = savedPalette;
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', palette);
        root.setAttribute('data-palette', palette);
        root.setAttribute('data-mode', dark ? 'dark' : 'light');
        root.setAttribute('data-v6-mode', dark ? 'dark' : 'light');
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', dark ? '#1b2440' : '#9DD2F7');
        var density = 'cozy';
        var texture = 'on';
        try {
          var v5 = JSON.parse(localStorage.getItem('data-ledger-v5') || '{}');
          if (v5 && v5.state) {
            if (v5.state.density === 'compact') density = 'compact';
            if (v5.state.texture === false) texture = 'off';
          }
        } catch (e) {}
        root.setAttribute('data-density', density);
        root.setAttribute('data-texture', texture);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
