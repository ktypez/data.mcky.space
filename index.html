<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Lumen Night Foundry paper (v2 dark default) -->
    <meta name="theme-color" content="#15151d" />
    <title>data.mcky.space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://data-api.fall3n.workers.dev" />
    <link rel="dns-prefetch" href="https://pub-462db07575b84a13b83ba0f2632f6ec2.r2.dev" />
    <!-- v2 registry chrome fonts: non-blocking (preload + swap) so the font
      CSS never delays first paint. Theme fonts load lazily via ThemeInjector. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap"
      />
    </noscript>
    <!-- NOTE: maplibre-gl is NOT loaded globally anymore. MapPreview and
      MapPicker dynamically import the npm bundle (shared `map` chunk) only
      on pages that render a map, so the catalog pays zero map cost. -->
    <script>
      // Pre-paint theme boot: ALWAYS load a full theme stylesheet before
      // React mounts (saved theme, else the default = portal), so the app is
      // never unstyled and the :root/.dark fallback vars are unnecessary.
      // Keep THEMES in sync with src/lib/design/themes.ts (id + staticCss +
      // dark-only flag). Fonts load lazily via ThemeInjector, not here.
      (function () {
        var THEMES = {
          dusk: { css: '/themes/dusk.css', dark: false },
          bubblegum: { css: '/themes/bubblegum.css', dark: false },
          slate: { css: '/themes/slate.css', dark: false },
          glitchpage: { css: '/themes/glitchpage.css', dark: true },
          crt: { css: '/themes/crt.css', dark: true },
          claude: { css: '/themes/claude.css', dark: false },
          rack: { css: '/themes/rack.css', dark: true },
          noc: { css: '/themes/noc.css', dark: true },
          min: { css: '/themes/min.css', dark: false, light: true },
          brut: { css: '/themes/brut.css', dark: false, light: true },
          mcky: { css: '/themes/mcky.css', dark: false, light: true },
          blueprint: { css: '/themes/blueprint.css', dark: false },
          noir: { css: '/themes/noir.css', dark: false },
          portal: { css: '/themes/portal.css', dark: false },
        };
        var id = null;
        try {
          var raw = localStorage.getItem('ezzylist-ui');
          if (raw) {
            var data = JSON.parse(raw);
            if (data && data.state && typeof data.state.theme === 'string') id = data.state.theme;
          }
        } catch (e) {}
        // One-time migration: users who still have the old 'claude' default
        // get switched to 'portal' once, then we stamp a flag so future
        // visits respect whatever they pick next.
        var MIG_KEY = 'theme-migrated-to-portal-v1';
        try {
          if (id === 'claude' && !localStorage.getItem(MIG_KEY)) {
            id = 'portal';
            try {
              var raw2 = localStorage.getItem('ezzylist-ui');
              if (raw2) {
                var data2 = JSON.parse(raw2);
                if (data2 && data2.state) {
                  data2.state.theme = 'portal';
                  localStorage.setItem('ezzylist-ui', JSON.stringify(data2));
                }
              }
            } catch (e) {}
            try { localStorage.setItem(MIG_KEY, '1'); } catch (e) {}
          }
        } catch (e) {}
        if (!THEMES[id]) id = 'portal'; // invalid/stale id → default theme
        var t = THEMES[id];
        var root = document.documentElement;
        root.setAttribute('data-theme', id);
        // dark-only themes force .dark; light-only themes always stay light;
        // dual themes respect saved mode/system.
        var dark = t.dark;
        if (!dark && !t.light) {
          var mode = null;
          try { mode = localStorage.getItem('theme'); } catch (e) {}
          if (mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            dark = true;
          }
        }
        if (dark) root.classList.add('dark');
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = t.css;
        document.head.appendChild(l);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
