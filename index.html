<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>data.mcky.space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Pre-paint theme boot: ALWAYS load a full theme stylesheet before
      // React mounts (saved theme, else the default = claude), so the app is
      // never unstyled and the :root/.dark fallback vars are unnecessary.
      // Keep THEMES in sync with src/lib/design/themes.ts (id + staticCss +
      // dark-only flag). Fonts load lazily via ThemeInjector, not here.
      (function () {
        var THEMES = {
          bubblegum: { css: '/themes/bubblegum.css', dark: false },
          slate: { css: '/themes/slate.css', dark: false },
          glitchpage: { css: '/themes/glitchpage.css', dark: true },
          crt: { css: '/themes/crt.css', dark: true },
          claude: { css: '/themes/claude.css', dark: false },
          rack: { css: '/themes/rack.css', dark: true },
          noc: { css: '/themes/noc.css', dark: true },
          min: { css: '/themes/min.css', dark: false },
          brut: { css: '/themes/brut.css', dark: false },
          moss: { css: '/themes/moss.css', dark: false },
          mcky: { css: '/themes/mcky.css', dark: false },
        };
        var id = null;
        try {
          var raw = localStorage.getItem('ezzylist-ui');
          if (raw) {
            var data = JSON.parse(raw);
            if (data && data.state && typeof data.state.theme === 'string') id = data.state.theme;
          }
        } catch (e) {}
        if (!THEMES[id]) id = 'claude'; // invalid/stale id → default theme
        var t = THEMES[id];
        var root = document.documentElement;
        root.setAttribute('data-theme', id);
        // dark-only themes force .dark; dual themes respect saved mode/system.
        var dark = t.dark;
        if (!dark) {
          var mode = null;
          try { mode = localStorage.getItem('theme'); } catch (e) {}
          if (mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            dark = true;
          }
        }
        if (dark) root.classList.add('dark');
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = t.css;
        document.head.appendChild(l);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
