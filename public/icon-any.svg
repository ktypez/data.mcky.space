<?xml version="1.0" encoding="UTF-8"?>
<!-- EzzyList app icon — "any" purpose. Full-bleed solid background, bold mark
     sized to stay legible down to 48px launcher size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b29"/>
      <stop offset="1" stop-color="#121220"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Record card: thick outline so it survives small rasterisation -->
  <rect x="128" y="118" width="256" height="276" rx="44"
        fill="none" stroke="url(#ink)" stroke-width="26"/>

  <!-- List rows: three bold bars, one shorter for rhythm -->
  <rect x="178" y="186" width="156" height="26" rx="13" fill="#a5b4fc"/>
  <rect x="178" y="243" width="108" height="26" rx="13" fill="#8b5cf6"/>
  <rect x="178" y="300" width="132" height="26" rx="13" fill="#8b5cf6"/>

  <!-- Location pin: the app's GPS/address feature, kept off the bar rows -->
  <path d="M356 300a48 48 0 1 1 96 0c0 34-48 82-48 82s-48-48-48-82z" fill="#6366f1"/>
  <circle cx="404" cy="300" r="17" fill="#121220"/>
</svg>
